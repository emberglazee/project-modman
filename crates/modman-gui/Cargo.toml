[package]
name = "modman-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native desktop front end for the modman merge engine"

[dependencies]
modman-core = { path = "../modman-core" }
modman-pak = { path = "../modman-pak" }

# egui rather than a webview: no browser engine, no system toolkit, one binary.
# x11 + wayland are not implied once default-features is off: without them
# winit has no platform and fails with "platform ... not supported". "clipboard"
# is off in that same default set, and leaving it off compiles the clipboard
# backend out entirely, so Ctrl+C on the merge report does nothing.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
rfd = "0.17.2"

# Archive extraction, all pure Rust so nothing has to be installed or bundled.
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
# sevenz-rust was abandoned (repository deleted, RUSTSEC-2026-0246) and every
# version of it, 0.6.1 included, writes outside the extraction directory when an
# archive entry is named `../x` or an absolute path (RUSTSEC-2026-0245). Its
# maintained successor validates entry names before every write, and errors out
# instead of extracting. Decode only: no encoder, no bzip2/ppmd/aes, which is
# exactly what the old crate handled.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["util"] }
# Reading only: we never write or decrypt RAR archives, and the writer plus
# crypto paths cost several MB of binary.
rars = { version = "0.12.2", default-features = false }
