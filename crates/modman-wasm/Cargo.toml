[package]
name = "modman-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
modman-core = { path = "../modman-core" }
# Workspace repak: same features as the merger (compression off, encryption
# kept; see the root Cargo.toml).
repak = { workspace = true }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
serde_json = "1.0.154"

# Rust's wasm32 target emits bulk-memory, sign-extension and non-trapping float
# conversions by default now. wasm-pack's bundled wasm-opt validates with a
# narrower feature set and fails with "Bulk memory operations require bulk
# memory", so the features it needs are named here rather than skipped: turning
# wasm-opt off instead would ship a several-times-larger module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-nontrapping-float-to-int",
  "--enable-mutable-globals",
]
