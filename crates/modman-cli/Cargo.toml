[package]
name = "modman"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
modman-pak = { path = "../modman-pak" }
modman-core = { path = "../modman-core" }
modman-uasset = { path = "../modman-uasset" }
serde.workspace = true
serde_json.workspace = true

# Double-click detection: pause the welcome screen when the exe was opened
# from Explorer (a console with a single attached process).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
