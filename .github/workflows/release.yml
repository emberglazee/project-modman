name: Release

run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NEVER cancel a side-effecting release: a cancel landing between the bump
  # push and release creation would leave main bumped with no release.
  # Re-run safety comes from the tag guard + CHANGELOG checks in the bump job.
  cancel-in-progress: false

jobs:
  # ── Version bump FIRST: every downstream artifact (binaries, the tag) must ──
  # ── describe one and the same commit. Building before the bump shipped     ──
  # ── binaries whose CARGO_PKG_VERSION was the PREVIOUS release's.            ──
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.VERSION }}
      sha: ${{ steps.bump.outputs.SHA }}
    steps:
      - uses: actions/checkout@v6

      - name: Bump Version
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')

          if [ "${{ inputs.bump }}" != "none" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            VERSION="$CURRENT"
          fi

          # ── Re-run safety: never publish a version that is already tagged. ──
          # ls-remote exit codes: 0 = tag exists, 2 = no match, anything else
          # = the query itself failed (abort rather than skip the guard).
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /tmp/lsremote.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Tag v$VERSION already exists on origin — that release is already published. If a previous run pushed the bump but never published it, re-dispatch with bump = none to release the current tree."
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "::error::Could not query origin tags (exit $rc):"
            cat /tmp/lsremote.txt
            exit 1
          fi

          # ── The CHANGELOG must already carry this version, BEFORE pushing. ──
          if ! grep -q "^## \[v$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' section — add it (and commit it) before dispatching this release."
            exit 1
          fi
          if [ "${{ inputs.bump }}" != "none" ]; then
            staged=$(sed -nE 's/^## \[v([^]]+)\].*/\1/p' CHANGELOG.md | head -1)
            if [ "$staged" != "$VERSION" ]; then
              echo "::error::CHANGELOG.md stages v$staged but this dispatch computes v$VERSION — stage that section, or dispatch the bump type it corresponds to."
              exit 1
            fi
          fi

          if [ "${{ inputs.bump }}" != "none" ]; then
            sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml

            # Fail fast if the sed above did not land: a silent no-op would
            # commit a bumped lock with a stale workspace version.
            grep -q "^version = \"$VERSION\"$" Cargo.toml || {
              echo "::error::Cargo.toml version was not updated to $VERSION"
              exit 1
            }

            # Sync every modman* package's version line in Cargo.lock. The
            # previous approach (`cargo generate-lockfile`) re-resolved the
            # whole dependency graph, silently upgrading unrelated crates
            # inside this commit — and the release shipped binaries built
            # from the pre-bump lock. Edit the entries directly instead.
            python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          lock = pathlib.Path("Cargo.lock")
          text = lock.read_text()
          new_text, count = re.subn(
              r'(\[\[package\]\]\nname = "modman[^"]*"\nversion = )"[^"]+"',
              lambda m: m.group(1) + '"' + version + '"',
              text,
          )
          if count < 1:
              sys.exit("no modman* package entries found in Cargo.lock")
          lock.write_text(new_text)
          print(f"updated {count} lock entries")
          PY

            # The only permitted lockfile change is those version lines.
            added=$(git diff --numstat -- Cargo.lock | cut -f1)
            removed=$(git diff --numstat -- Cargo.lock | cut -f2)
            if [ -z "$added" ] || [ "$added" != "$removed" ] || [ "$added" -lt 1 ]; then
              echo "::error::Cargo.lock churn unexpected: +$added/-$removed (expected equal counts, at least 1)"
              git diff -- Cargo.lock
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ── Binaries build from the BUMPED commit, so each binary ──
  # ── self-reports the version its release tag names.       ──
  build:
    needs: bump
    uses: ./.github/workflows/rust-build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  create-release:
    name: Create Release
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin the whole job to the exact commit the binaries were built
          # from (the bump commit), not the branch head.
          ref: ${{ needs.bump.outputs.sha }}
          # Full history + tags: the release description script counts
          # contributions since the previous release tag (git describe/
          # rev-list) and resolves heads to SHAs for the compare API.
          fetch-depth: 0

      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          path: bin-stage
          pattern: modman-*

      - name: Extract Release Notes
        # Changelog sections + contributor medals since the previous release
        # tag (git describe); PR authors are resolved via the GitHub compare
        # and pulls APIs, so the step needs a token and full history.
        run: |
          python .github/scripts/generate_release_description.py > release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp bin-stage/modman-linux-amd64/modman release-assets/modman-linux-amd64
          cp bin-stage/modman-linux-arm64/modman release-assets/modman-linux-arm64
          cp bin-stage/modman-win-amd64.exe/modman.exe release-assets/modman-win-amd64.exe
          cp bin-stage/modman-win-arm64.exe/modman.exe release-assets/modman-win-arm64.exe
          cp bin-stage/modman-macos-arm64/modman release-assets/modman-macos-arm64
          cp bin-stage/modman-macos-amd64/modman release-assets/modman-macos-amd64
          chmod +x release-assets/modman-linux-* release-assets/modman-macos-*

      # Checksums for every published artifact so a locally downloaded build
      # can be verified with `sha256sum -c SHA256SUMS` before running it.
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          # Bare filenames (no ./ prefix) so the sums match the asset names
          # exactly as published.
          sha256sum modman-* > SHA256SUMS
          echo "── SHA256SUMS ──"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: v${{ needs.bump.outputs.version }}
          # Pin the tag to the exact commit the artifacts were built from,
          # instead of whatever the default branch happens to point at.
          target_commitish: ${{ needs.bump.outputs.sha }}
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.bump.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run names are fixed at trigger time ("Release (minor)") before the
      # version bump runs, so the actual version is invisible from the Actions
      # list. This step writes the released version — plus the bump type and
      # the previous version — to the job summary so it shows up on the run's
      # Summary tab.
      - name: Release Summary
        if: always() && needs.bump.outputs.version
        run: |
          python .github/scripts/generate_release_summary.py \
            --version ${{ needs.bump.outputs.version }} \
            --bump ${{ inputs.bump }}
