name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/modman-wasm/**"
      - "crates/modman-core/**"
      - "crates/modman-uasset/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time; let in-flight deploys finish (no cancel).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: |
          curl -sL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          cp /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack "$HOME/.cargo/bin/"
          wasm-pack --version

      - name: Build wasm + site
        run: wasm-pack build crates/modman-wasm --target web --release --out-dir ../../web/pkg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
