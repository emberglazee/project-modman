name: Rust Build (Reusable)

on:
  workflow_call:
    inputs:
      # Commit to build. Callers that need a specific commit (the release
      # workflow builds the version-bump commit) pass it here; everyone else
      # gets the caller's own SHA.
      ref:
        description: 'Commit to check out (defaults to the caller SHA)'
        required: false
        type: string

# Artifact attestations: every binary this workflow produces gets a signed
# SLSA provenance statement, so a download can be traced back to this workflow,
# this commit and this repository with one command (`gh attestation verify`).
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ── Static gate: formatting + lint on both Linux and Windows — the ──
  # ── Windows leg exists so `cfg(windows)` code is actually linted.    ──
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting Check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings

  # ── Native test matrix: every target that gets a release binary, tested on
  # ── its own runner. macOS amd64 is excluded — it is a cross-build from the
  # ── arm64 macos runner (no Intel mac runners), not a native target. ──
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --workspace --locked
        env:
          RUST_BACKTRACE: 1

  # ── Release builds: only after ALL native tests pass (check + 5-target ──
  # ── matrix). Builds 6 combos; asset names follow modman-<os>-<arch>[.exe]. ──
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Native builds on each platform/arch. Only macOS amd64 is
          # cross-built (from the arm64 macos runner — GitHub's Intel mac
          # runners are scarce). Asset names follow `modman-<os>-<arch>[.exe]`.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: modman-linux-amd64
            gui_asset: modman-gui-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: modman-linux-arm64
            gui_asset: modman-gui-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: modman-win-amd64.exe
            gui_asset: modman-gui-win-amd64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: modman-win-arm64.exe
            gui_asset: modman-gui-win-arm64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: modman-macos-arm64
            gui_asset: modman-gui-macos-arm64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: modman-macos-amd64
            gui_asset: modman-gui-macos-amd64.zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          # --locked: the release bump edits Cargo.lock (version lines only);
          # if that edit ever left the lock inconsistent, this fails the
          # release instead of cargo silently repairing it at build time.
          cargo build --release --locked --target ${{ matrix.target }} -p modman -p modman-gui

      # ── Windows smoke test: the binary must run, and (with the static-CRT ──
      # ── config in .cargo/config.toml) must not depend on the Visual C++  ──
      # ── Redistributable — checked with dumpbin.                            ──
      - name: Smoke Test (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = Resolve-Path "target/${{ matrix.target }}/release/modman.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbinCandidates = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere.exe failed to locate the MSVC tools"
          }
          $dumpbin = $dumpbinCandidates | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe not found"
          }
          $dependencies = & $dumpbin /dependents $exe | Out-String
          if ($LASTEXITCODE -ne 0 -or $dependencies -notmatch 'KERNEL32\.dll') {
            throw "dumpbin.exe could not inspect modman dependencies: $dependencies"
          }
          if ($dependencies -match 'VCRUNTIME[0-9_]*\.dll') {
            throw "modman still depends on the Visual C++ Redistributable: $dependencies"
          }
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "modman --version failed: $version"
          }
          Write-Host "modman smoke test OK: $version"

      - name: Smoke Test GUI (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = Resolve-Path "target/${{ matrix.target }}/release/modman-gui.exe"
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "modman-gui --version failed: $version"
          }
          Write-Host "modman-gui smoke test OK: $version"

      # ── GUI packaging ────────────────────────────────────────────────────
      # Linux and Windows ship the bare binary. macOS ships a .app bundle,
      # ad-hoc signed: a bare Mach-O has no Dock entry, and Gatekeeper wants a
      # bundle to judge. Signing with '-' needs no Apple account; users still
      # get the "unverified developer" prompt on first open.
      # macOS is deliberately excluded: the GUI has never been run on a Mac, and
      # an ad-hoc-signed .app that Gatekeeper then blocks is an unreproducible
      # bug report. Mac users run the Windows build under Whisky or CrossOver,
      # which is the same win32 path we verify under Wine. The macOS CLI
      # binaries are still built and published as before, and `cargo test
      # --workspace` on the macOS leg still compiles the GUI, so breakage there
      # cannot go unnoticed.
      - name: Package GUI
        if: ${{ !contains(matrix.target, 'darwin') }}
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          OUT="dist/${{ matrix.gui_asset }}"
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p dist
          BIN="target/$T/release/modman-gui"
          [ -f "$BIN" ] || BIN="${BIN}.exe"
          case "$T" in
            *windows*)
              cp "$BIN" "$OUT"
              ;;
            *darwin*)
              APP="dist/Modman.app"
              rm -rf "$APP"
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp "$BIN" "$APP/Contents/MacOS/modman-gui"
              chmod +x "$APP/Contents/MacOS/modman-gui"
              cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Project Modman</string>
            <key>CFBundleDisplayName</key><string>Project Modman</string>
            <key>CFBundleExecutable</key><string>modman-gui</string>
            <key>CFBundleIdentifier</key><string>io.github.emberglazee.modman</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
              codesign --force --sign - --timestamp=none "$APP"
              codesign --verify --verbose "$APP"
              ditto -c -k --keepParent "$APP" "$OUT"
              ;;
            *)
              cp "$BIN" "$OUT"
              chmod +x "$OUT"
              ;;
          esac
          ls -l "$OUT"

      # Attest exactly what gets uploaded, not the pre-packaged build output:
      # the digest a user verifies must be the digest they downloaded.
      #
      # Not on pull requests: a fork PR never receives an OIDC token, so the
      # attest step would fail the build for every outside contributor. PR
      # binaries are not published, so they have nothing to prove.
      - name: Attest CLI binary
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@v4
        with:
          subject-path: target/${{ matrix.target }}/release/modman${{ contains(matrix.target, 'windows') && '.exe' || '' }}

      - name: Attest GUI binary
        if: ${{ github.event_name != 'pull_request' && !contains(matrix.target, 'darwin') }}
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.gui_asset }}

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            target/${{ matrix.target }}/release/modman
            target/${{ matrix.target }}/release/modman.exe
          if-no-files-found: error

      - name: Upload GUI
        if: ${{ !contains(matrix.target, 'darwin') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gui_asset }}
          path: dist/${{ matrix.gui_asset }}
          if-no-files-found: error
