name: Nexus upload

# Publishes already-released binaries to their existing file entries on the
# Nexus mod page through the v3 Upload API (open beta). Reusable from the
# release workflow and dispatchable on its own, which matters because a release
# dispatch cannot be repeated once its tag exists.
#
# Two things the API dictates:
#   * `/mod-files/{id}/versions` wants the file's INTERNAL v3 id, not the
#     game-scoped `file_id` the v1 API returns. Passing the game-scoped id is
#     rejected with 403 "You do not have permission to upload files to this mod".
#   * allowed upload types are .rar, .zip, .7z, .exe and .omod. `.tar.gz` is
#     refused with 422, so every platform ships a .zip. The Unix binaries are
#     chmod +x'd before zipping, and the docs still tell Linux users to run
#     `chmod +x modman` because some extractors drop the mode.
#
# The GUI has its own two Linux entries (amd64 is the page's primary file). A
# version whose GUI zips were uploaded by hand can skip those legs with
# `gui: false`, otherwise each run adds a second identical version to them.
#
# Windows is deliberately NOT published here. Nexus quarantines every unsigned
# Windows executable we upload, so a Windows entry would sit un-downloadable
# next to a stale version. The mod description already links to the GitHub
# release for Windows builds, which is both usable and verifiable against the
# release CI, and that link is what Windows users actually use. The previous
# Windows file entries (8187885, 8187891) are left in place, frozen, rather than
# deleted, so nothing 404s for anyone who bookmarked them.

on:
  workflow_call:
    inputs:
      version:
        description: "Version being published, without the leading v (e.g. 0.4.5)"
        type: string
        required: true
      gui:
        description: "Also publish the two Linux GUI entries (set false when they were uploaded by hand)"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.4.5)"
        type: string
        required: true
      gui:
        description: "Also publish the two Linux GUI entries (set false when they were uploaded by hand)"
        type: boolean
        default: true

jobs:
  upload:
    name: Nexus (${{ matrix.label }})
    # GUI legs are skipped when that version's GUI zips were uploaded by hand.
    if: ${{ !matrix.gui || inputs.gui }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Linux amd64"
            asset: modman-linux-amd64
            bin: modman
            file_id: 8187864
            description: >-
              modman for x86-64 Linux, with the MIT license. Extract the archive,
              run chmod +x modman, then ./modman --help.
          - label: "Linux arm64"
            asset: modman-linux-arm64
            bin: modman
            file_id: 8187867
            description: >-
              modman for 64-bit ARM Linux, with the MIT license. Extract the
              archive, run chmod +x modman, then ./modman --help.
          - label: "MacOS amd64 (Intel)"
            asset: modman-macos-amd64
            bin: modman
            file_id: 8187876
            description: >-
              modman for Intel Macs, with the MIT license. The binary is
              unsigned, so the first run needs a right-click then Open, or
              xattr -d com.apple.quarantine modman.
          - label: "MacOS arm64 (Apple)"
            asset: modman-macos-arm64
            bin: modman
            file_id: 8187882
            description: >-
              modman for Apple Silicon, with the MIT license. The binary is
              unsigned, so the first run needs a right-click then Open, or
              xattr -d com.apple.quarantine modman.
          - label: "GUI Linux amd64"
            asset: modman-gui-linux-amd64
            bin: modman-gui
            file_id: 8209770
            gui: true
            readme: packaging/gui-readme.txt
            description: >-
              The desktop app for x86-64 Linux, with the MIT license: drop mod
              archives on the window and it merges, reports and installs them.
              Needs a desktop with OpenGL 3.3. Extract, chmod +x modman-gui,
              then run it.
          - label: "GUI Linux arm64"
            asset: modman-gui-linux-arm64
            bin: modman-gui
            file_id: 8209767
            gui: true
            readme: packaging/gui-readme.txt
            description: >-
              The desktop app for 64-bit ARM Linux, with the MIT license: drop
              mod archives on the window and it merges, reports and installs
              them. Needs a desktop with OpenGL 3.3. Extract, chmod +x
              modman-gui, then run it.
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Download the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "v${{ inputs.version }}" \
            --pattern "${{ matrix.asset }}" --dir assets
          ls -l assets

      - name: Package
        id: pack
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp "assets/${{ matrix.asset }}" "pkg/${{ matrix.bin }}"
          chmod +x "pkg/${{ matrix.bin }}"
          cp LICENSE pkg/LICENSE
          if [ -n "${{ matrix.readme }}" ]; then
            cp "${{ matrix.readme }}" pkg/README.txt
          fi
          (cd pkg && zip -q -r "../${{ matrix.asset }}.zip" .)
          echo "file=${{ matrix.asset }}.zip" >> "$GITHUB_OUTPUT"
          ls -l "${{ matrix.asset }}.zip"

      - name: Upload to Nexus
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ matrix.file_id }}
          filename: ${{ steps.pack.outputs.file }}
          version: ${{ inputs.version }}
          display_name: ${{ matrix.label }}
          description: ${{ matrix.description }}
          category: main
          update_mod_version: true
          archive_existing_version: false
