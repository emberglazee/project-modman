[workspace]
resolver = "2"
members = [
    "crates/modman-core",
    "crates/modman-uasset",
    "crates/modman-pak",
    "crates/modman-cli",
    "crates/modman-wasm",
    "crates/modman-gui",
]

[workspace.package]
repository = "https://github.com/emberglazee/project-modman"
authors = ["emberglazee"]
license = "MIT"
version = "0.5.1"
edition = "2021"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Release binaries ship as single files with no installer, so size is a feature:
# strip symbols, one codegen unit, and thin LTO (fat LTO costs much more build
# time across six CI legs for a small further gain).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
