[workspace]
resolver = "2"
members = [
    "crates/modman-core",
    "crates/modman-uasset",
    "crates/modman-pak",
    "crates/modman-cli",
    "crates/modman-wasm",
]

[workspace.package]
repository = "https://github.com/emberglazee/project-modman"
authors = ["emberglazee"]
license = "MIT"
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
