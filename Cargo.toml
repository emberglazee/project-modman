[workspace]
resolver = "2"
members = [
    "crates/modman-core",
    "crates/modman-uasset",
    "crates/modman-pak",
    "crates/modman-cli",
    "crates/modman-wasm",
    "crates/modman-gui",
]

[workspace.package]
repository = "https://github.com/emberglazee/project-modman"
authors = ["emberglazee"]
license = "MIT"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
# Upstream repak still pins zstd 0.13 (RUSTSEC-2026-0391/-0398/-0403).
# This fork is upstream 355b5f6 plus the zstd 0.14.3 bump.
repak = { git = "https://github.com/emberglazee/repak", rev = "909e098c22591417af53194655d43b396636d4ac", default-features = false, features = ["encryption", "compression"] }

# Release binaries ship as single files with no installer, so size is a feature:
# strip symbols, one codegen unit, and thin LTO (fat LTO costs much more build
# time across six CI legs for a small further gain).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
